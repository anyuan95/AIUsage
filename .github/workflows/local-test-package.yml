name: Local Test Package

on:
  workflow_dispatch:
  push:
    branches:
      - feature/main-perf-combined

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve SPM dependencies
        shell: bash
        run: |
          xcodebuild -project AIUsage.xcodeproj -scheme AIUsage \
            -destination "generic/platform=macOS" \
            -resolvePackageDependencies \
            -derivedDataPath build/DerivedData

      - name: Build macOS test artifacts
        shell: bash
        env:
          REQUIRE_SPARKLE_SIGNING: "0"
          REQUIRE_STABLE_SIGNING: "0"
        run: ./scripts/package-release.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: AIUsage-local-test-macOS
          path: |
            dist/AIUsage-*-macOS.zip
            dist/AIUsage-*-macOS.dmg
          if-no-files-found: error
